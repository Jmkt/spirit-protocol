name: Validate Spirits

on:
  push:
    paths:
      - 'spirits/**/*.spirit.md'
      - 'SCHEMA.md'
      - 'src/validate.js'
      - 'package.json'
  pull_request:
    paths:
      - 'spirits/**/*.spirit.md'
      - 'SCHEMA.md'
      - 'src/validate.js'
      - 'package.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
